[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-crystal-seed"
version = "0.1.0"
description = "A professional Python project template"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "py-crystal-seed maintainers" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/your-org/py-crystal-seed"
Repository = "https://github.com/your-org/py-crystal-seed"
Issues = "https://github.com/your-org/py-crystal-seed/issues"

[project.optional-dependencies]
dev = [
    "cookiecutter",
    "pytest",
    "pre-commit",
    "ruff",
    "pyright",
    "build",
    "twine",
    "pip-audit",
    "cyclonedx-bom",
    "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
