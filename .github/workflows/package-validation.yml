name: package-validation

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging toolchain
        run: python -m pip install -U pip wheel

      - name: Install project (dev)
        run: python -m pip install -e '.[dev]'

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Import package smoke
        run: python -c "import py_crystal_seed; print(py_crystal_seed.__name__)"
