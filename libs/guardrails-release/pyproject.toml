[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-release"
version = "0.1.0"
description = "Release guardrail policy engine"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
guardrails-check-release-policy = "guardrails_release.cli:check_release_policy_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrails_release = ["resources/**/*.json", "resources/**/*.yml"]
