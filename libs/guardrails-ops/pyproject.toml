[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-ops"
version = "0.1.0"
description = "Operations guardrail policy engine"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
guardrails-run-ops-gates = "guardrails_ops.cli:run_ops_gates"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrails_ops = ["resources/**/*.json", "resources/**/*.yml"]
