version: 1
production_paths:
  - src/**
exclude_paths:
  - tests/**
  - docs/**
required_evidence:
  any_of:
    - adr
    - roadmap
    - governance_log
    - explicit_exception
adr_paths:
  - docs/adr/**
roadmap_paths:
  - docs/maturity/roadmap/**
governance_log: governance/governance_log.yml
exception_tag: governance-exception
