name: governance-waivers

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  waivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python -m pip install pyyaml

      - name: Validate waiver registry
        run: python tools/check_waivers.py
