name: publish-pypi

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging toolchain
        run: python -m pip install -U pip wheel

      - name: Install project (dev)
        run: python -m pip install -e '.[dev]'

      - name: Validate release policy
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python tools/check_release_policy.py

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          upload-signing-artifacts: true
          verify: true
          verify-cert-identity: "https://github.com/${{ github.repository }}/.github/workflows/publish-pypi.yml@${{ github.ref }}"
          verify-oidc-issuer: "https://token.actions.githubusercontent.com"

      - name: Enforce signature bundles for all artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No dist artifacts found to sign."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            bundle="${artifact}.sigstore.json"
            if [ ! -f "$bundle" ]; then
              echo "Missing Sigstore bundle: $bundle"
              exit 1
            fi
          done

      - name: Upload signed distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-dist-pypi
          path: dist/*

  verify-publish:
    runs-on: ubuntu-latest
    needs: [build-sign]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade tooling for verification
        run: python -m pip install -U pip sigstore

      - name: Download signed distribution bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-dist-pypi
          path: dist

      - name: Verify signed artifacts in isolated publish job
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No distribution artifacts found."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            bundle="${artifact}.sigstore.json"
            if [ ! -f "$bundle" ]; then
              echo "Missing Sigstore bundle: $bundle"
              exit 1
            fi
            python -m sigstore verify identity "$artifact" \
              --bundle "$bundle" \
              --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/publish-pypi.yml@${{ github.ref }}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          done

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
