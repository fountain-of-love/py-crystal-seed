name: release-policy

on:
  pull_request:
  push:
    tags:
      - "v*"
      - "*"

jobs:
  pr-policy:
    if: ${{ '{{' }} github.event_name == 'pull_request' {{ '}}' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release policy (PR)
        env:
          DIFF_BASE: ${{ '{{' }} github.event.pull_request.base.sha {{ '}}' }}
          DIFF_HEAD: ${{ '{{' }} github.sha {{ '}}' }}
        run: python tools/check_release_policy.py

  tag-policy:
    if: ${{ '{{' }} github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') {{ '}}' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release policy (tag)
        env:
          RELEASE_TAG: ${{ '{{' }} github.ref_name {{ '}}' }}
        run: python tools/check_release_policy.py
