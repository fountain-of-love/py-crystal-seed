stages:
  - quality
  - package
  - release

default:
  image: python:3.12

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

# gitlab-ops-gates
ops_gates:
  stage: quality
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - set -eu
    - python -m pip install -U pip wheel
    - python -m pip install -e '.[dev]'
    - make ops-gate

# gitlab-release-build-sign
release_build_sign:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG'
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - set -eu
    - python -m pip install -U pip wheel
    - python -m pip install -e '.[dev]'
    - RELEASE_TAG="$CI_COMMIT_TAG" python tools/check_release_policy.py
    - python -m build
    - python -m twine check dist/*
    - |
      found=0
      for artifact in dist/*.whl dist/*.tar.gz; do
        if [ ! -f "$artifact" ]; then
          continue
        fi
        found=1
        python -m sigstore sign \
          --identity-token "$SIGSTORE_ID_TOKEN" \
          --oidc-issuer "${SIGSTORE_OIDC_ISSUER:-https://gitlab.com}" \
          --overwrite \
          "$artifact"
      done
      if [ "$found" -ne 1 ]; then
        echo "No distribution artifacts found to sign."
        exit 1
      fi
    - |
      for artifact in dist/*.whl dist/*.tar.gz; do
        if [ ! -f "$artifact" ]; then
          continue
        fi
        bundle="${artifact}.sigstore.json"
        if [ ! -f "$bundle" ]; then
          echo "Missing Sigstore bundle: $bundle"
          exit 1
        fi
      done
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*

# gitlab-release-verify-gate
release_verify_gate:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: release_build_sign
      artifacts: true
  script:
    - set -eu
    - python -m pip install -U pip sigstore
    - |
      if [ -z "${SIGSTORE_CERT_IDENTITY:-}" ]; then
        echo "Set SIGSTORE_CERT_IDENTITY in GitLab CI/CD variables for release verification."
        exit 1
      fi
    - |
      found=0
      for artifact in dist/*.whl dist/*.tar.gz; do
        if [ ! -f "$artifact" ]; then
          continue
        fi
        found=1
        bundle="${artifact}.sigstore.json"
        if [ ! -f "$bundle" ]; then
          echo "Missing Sigstore bundle: $bundle"
          exit 1
        fi
        python -m sigstore verify identity "$artifact" \
          --bundle "$bundle" \
          --cert-identity "$SIGSTORE_CERT_IDENTITY" \
          --cert-oidc-issuer "${SIGSTORE_OIDC_ISSUER:-https://gitlab.com}"
      done
      if [ "$found" -ne 1 ]; then
        echo "No distribution artifacts found to verify."
        exit 1
      fi

# gitlab-release-publish-testpypi
release_publish_testpypi:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  needs:
    - job: release_verify_gate
      artifacts: true
  script:
    - set -eu
    - python -m pip install -U pip twine
    - |
      if [ -z "${TEST_PYPI_API_TOKEN:-}" ]; then
        echo "Set TEST_PYPI_API_TOKEN for TestPyPI publish."
        exit 1
      fi
    - python -m twine upload --non-interactive --repository-url https://test.pypi.org/legacy/ -u __token__ -p "$TEST_PYPI_API_TOKEN" dist/*

# gitlab-release-publish-pypi
release_publish_pypi:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  needs:
    - job: release_verify_gate
      artifacts: true
  script:
    - set -eu
    - python -m pip install -U pip twine
    - |
      if [ -z "${PYPI_API_TOKEN:-}" ]; then
        echo "Set PYPI_API_TOKEN for PyPI publish."
        exit 1
      fi
    - python -m twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" dist/*
